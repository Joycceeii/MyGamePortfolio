<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的游戏作品集</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 头部：自我介绍 -->
    <header>
        <div class="container">
            <h1>👋 我是[你的名字]</h1>
            <p>一名游戏开发者 / 爱好者 | 这里是我的一些作品</p>
        </div>
    </header>

    <!-- 作品展示区 -->
    <section class="portfolio">
        <div class="container">
            <h2>🎮 我的游戏作品</h2>
            <div class="games-grid">
                <!-- 游戏卡片 1 -->
                <div class="game-card">
                    <img src="images/game1.jpg" alt="游戏1截图">
                    <div class="game-info">
                        <h3>游戏名称1</h3>
                        <p>这是一款[游戏类型]，讲述了[一句话介绍]。</p>
                        <a href="#" target="_blank" class="btn">试玩 / 查看</a>
                    </div>
                </div>

                <!-- 游戏卡片 2（复制整个 game-card 块即可添加更多） -->
                <div class="game-card">
                    <img src="images/game2.png" alt="游戏2截图">
                    <div class="game-info">
                        <h3>游戏名称2</h3>
                        <p>这是一款[游戏类型]，讲述了[一句话介绍]。</p>
                        <a href="#" target="_blank" class="btn">试玩 / 查看</a>
                    </div>
                </div>

                <!-- 可根据需要继续添加卡片 -->
            </div>
        </div>
    </section>

    <!-- 尾部 -->
    <footer>
        <div class="container">
            <p>© 2026 [你的名字] | 联系我：your-email@example.com</p>
        </div>
    </footer>
</body>
</html>
